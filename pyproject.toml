[project]
name = "it-config-as-code"
version = "0.1.0"
description = "Personal lab for identity configuration as code."
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
