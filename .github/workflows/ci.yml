name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Demo
        run: make demo

  terraform-fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - terraform/okta/environments/lab
          - terraform/entra/environments/lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: init and validate
        working-directory: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tflint
        run: |
          set -euo pipefail
          curl -fsSL -o tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v0.66.0/tflint_linux_amd64.zip"
          sudo unzip -qo tflint.zip -d /usr/local/bin
          tflint --version
      - name: Lint Okta
        working-directory: terraform/okta/environments/lab
        run: |
          set -euo pipefail
          tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --config "${GITHUB_WORKSPACE}/.tflint.hcl"
      - name: Lint Entra
        working-directory: terraform/entra/environments/lab
        run: |
          set -euo pipefail
          tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --config "${GITHUB_WORKSPACE}/.tflint.hcl"

  trivy:
    name: trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install trivy
        run: |
          set -euo pipefail
          curl -fsSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz"
          sudo tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: Scan Terraform
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --format table terraform

  check-secrets:
    name: Check tenant secrets
    runs-on: ubuntu-latest
    outputs:
      okta: ${{ steps.check.outputs.okta }}
      entra: ${{ steps.check.outputs.entra }}
    steps:
      - id: check
        env:
          OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
          OKTA_ORG_NAME: ${{ secrets.OKTA_ORG_NAME }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          set -euo pipefail
          okta=false
          entra=false
          if [ -n "${OKTA_API_TOKEN}" ] && [ -n "${OKTA_ORG_NAME}" ]; then
            okta=true
          fi
          if [ -n "${ARM_CLIENT_ID}" ] && [ -n "${ARM_CLIENT_SECRET}" ] && [ -n "${ARM_TENANT_ID}" ]; then
            entra=true
          fi
          echo "okta=${okta}" >> "${GITHUB_OUTPUT}"
          echo "entra=${entra}" >> "${GITHUB_OUTPUT}"
          echo "Okta plan will run: ${okta}"
          echo "Entra plan will run: ${entra}"

  plan-okta:
    name: Okta plan
    needs: [check-secrets, terraform-validate]
    if: needs.check-secrets.outputs.okta == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/okta/environments/lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Plan
        env:
          TF_IN_AUTOMATION: "1"
          TF_VAR_okta_api_token: ${{ secrets.OKTA_API_TOKEN }}
          OKTA_ORG_NAME: ${{ secrets.OKTA_ORG_NAME }}
          OKTA_BASE_URL: ${{ secrets.OKTA_BASE_URL }}
        run: |
          set -euo pipefail
          terraform init -input=false
          args=(-var-file=terraform.tfvars.example -var "okta_org_name=${OKTA_ORG_NAME}")
          if [ -n "${OKTA_BASE_URL}" ]; then
            args+=(-var "okta_base_url=${OKTA_BASE_URL}")
          fi
          set +e
          set -o pipefail
          terraform plan -input=false -no-color -detailed-exitcode "${args[@]}" | tee plan.txt
          code=$?
          set -e
          echo "terraform plan exit code: ${code}" | tee -a plan.txt
          if [ "${code}" -eq 1 ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: okta-plan
          path: terraform/okta/environments/lab/plan.txt
          retention-days: 7

  plan-entra:
    name: Entra plan
    needs: [check-secrets, terraform-validate]
    if: needs.check-secrets.outputs.entra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/entra/environments/lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Plan
        env:
          TF_IN_AUTOMATION: "1"
          TF_VAR_client_secret: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        run: |
          set -euo pipefail
          terraform init -input=false
          set +e
          set -o pipefail
          terraform plan -input=false -no-color -detailed-exitcode \
            -var-file=terraform.tfvars.example \
            -var "tenant_id=${ARM_TENANT_ID}" \
            -var "client_id=${ARM_CLIENT_ID}" | tee plan.txt
          code=$?
          set -e
          echo "terraform plan exit code: ${code}" | tee -a plan.txt
          if [ "${code}" -eq 1 ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: entra-plan
          path: terraform/entra/environments/lab/plan.txt
          retention-days: 7

  plan-comment:
    name: Plan comment
    needs: [plan-okta, plan-entra]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.plan-okta.result == 'success' || needs.plan-entra.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-plan"
          path: plans
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            function readPlan(name) {
              const file = path.join("plans", name, "plan.txt");
              if (!fs.existsSync(file)) {
                return "";
              }
              const text = fs.readFileSync(file, "utf8");
              const max = 20000;
              if (text.length <= max) {
                return text;
              }
              return text.slice(0, max) + "\n...[truncated]";
            }
            const sections = [];
            const okta = readPlan("okta-plan");
            const entra = readPlan("entra-plan");
            if (okta) {
              sections.push("### Okta\n\n```\n" + okta + "\n```");
            }
            if (entra) {
              sections.push("### Entra\n\n```\n" + entra + "\n```");
            }
            const body = [
              "<!-- it-config-plan -->",
              "## Terraform plan",
              "",
              "Generated because tenant secrets are configured. This comment is a plan, not an apply.",
              "",
              sections.join("\n\n"),
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "<!-- it-config-plan -->";
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
